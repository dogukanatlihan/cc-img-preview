name: Tested on my terminal
description: Say how the mod looked on a system or terminal, whether it worked or not.
title: "Tested on: <terminal> on <system>"
labels: ["tested-on"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Reports for terminals that are not yet in the README's "Tested on" table help the most: Linux, kitty, Ghostty, WezTerm, Alacritty, foot, Konsole, VS Code, and Windows Terminal after 0.2.4.
  - type: input
    id: terminal
    attributes:
      label: Terminal and its version
      placeholder: kitty 0.39.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      placeholder: Ubuntu 24.04 / macOS 15.3 / Windows 11 24H2
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Claude Code version and cc-img version
      description: "`claude --version`, and the version that `claude plugin list` shows for cc-img."
      placeholder: Claude Code 2.1.328, cc-img 0.2.4
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: What did you get?
      options:
        - Real pixels
        - Block characters
        - Name and open button, no picture
        - Nothing at all
        - Something else (describe below)
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What you saw
      description: What you did, what you saw, and a screenshot if you can. Inside tmux, screen or herdr? Over ssh?
    validations:
      required: true
