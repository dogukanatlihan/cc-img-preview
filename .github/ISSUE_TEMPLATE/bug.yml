name: Bug
description: Something the mod does wrong.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: The smallest steps that make it happen again. The image format and the tool call (Read, Bash, a screenshot, a paste) help.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Terminal, system, Claude Code version, cc-img version
      placeholder: iTerm2 3.5.10, macOS 15.3, Claude Code 2.1.328, cc-img 0.2.4
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Screenshot or log
      description: On Windows, the painter writes to `%TEMP%\cc-img\sixel.log`.
